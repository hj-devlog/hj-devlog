<svg width="960" height="280" viewBox="0 0 960 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101318"/>
      <stop offset="0.55" stop-color="#151923"/>
      <stop offset="1" stop-color="#0F1116"/>
    </linearGradient>
    <linearGradient id="gold" x1="160" y1="40" x2="800" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2C879"/>
      <stop offset="1" stop-color="#E8874E"/>
    </linearGradient>
    <filter id="glow" x="-30" y="-30" width="1020" height="340" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .muted { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { fill: #fff7e7; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; }
      .line { stroke: rgba(242, 200, 121, .3); stroke-width: 2; stroke-dasharray: 8 10; }
      .spark { fill: url(#gold); filter: url(#glow); }
      .card { fill: rgba(255, 255, 255, .055); stroke: rgba(255, 255, 255, .12); }
      @keyframes moveDot {
        0% { transform: translateX(0); opacity: 0; }
        10% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(560px); opacity: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
      }
      #dot1 { animation: moveDot 3.4s ease-in-out infinite; }
      #dot2 { animation: moveDot 3.4s ease-in-out .75s infinite; }
      #dot3 { animation: moveDot 3.4s ease-in-out 1.5s infinite; }
      #ui1 { animation: floatCard 4.2s ease-in-out infinite; }
      #ui2 { animation: floatCard 4.2s ease-in-out .8s infinite; }
      #pulse1, #pulse2, #pulse3 { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="280" rx="28" fill="url(#bg)"/>
  <circle cx="150" cy="52" r="88" fill="#F2C879" opacity=".08"/>
  <circle cx="824" cy="230" r="110" fill="#E8874E" opacity=".08"/>

  <g transform="translate(78 70)">
    <rect class="card" width="214" height="140" rx="18"/>
    <circle cx="28" cy="28" r="6" fill="#FF6B6B" opacity=".9"/>
    <circle cx="48" cy="28" r="6" fill="#FFD166" opacity=".9"/>
    <circle cx="68" cy="28" r="6" fill="#4ADE80" opacity=".9"/>
    <rect x="28" y="58" width="104" height="10" rx="5" fill="#fff7e7" opacity=".85"/>
    <rect x="28" y="82" width="158" height="8" rx="4" fill="#8b949e" opacity=".55"/>
    <rect x="28" y="102" width="126" height="8" rx="4" fill="#8b949e" opacity=".35"/>
    <text x="28" y="128" class="muted" font-size="13">user flow</text>
  </g>

  <path d="M320 140 C410 92 514 188 616 140 C672 114 716 112 774 138" class="line"/>
  <g transform="translate(318 132)">
    <circle id="dot1" class="spark" cx="0" cy="0" r="6"/>
    <circle id="dot2" class="spark" cx="0" cy="0" r="5" opacity=".8"/>
    <circle id="dot3" class="spark" cx="0" cy="0" r="4" opacity=".65"/>
  </g>

  <g id="ui1" transform="translate(650 58)">
    <rect class="card" width="214" height="78" rx="16"/>
    <rect x="20" y="20" width="54" height="10" rx="5" fill="#F2C879" opacity=".9"/>
    <rect x="20" y="44" width="154" height="8" rx="4" fill="#8b949e" opacity=".45"/>
    <circle id="pulse1" cx="184" cy="25" r="8" fill="#F2C879"/>
  </g>

  <g id="ui2" transform="translate(612 158)">
    <rect class="card" width="254" height="74" rx="16"/>
    <rect x="20" y="18" width="88" height="10" rx="5" fill="#fff7e7" opacity=".8"/>
    <rect x="20" y="43" width="188" height="8" rx="4" fill="#8b949e" opacity=".45"/>
    <circle id="pulse2" cx="222" cy="23" r="7" fill="#E8874E"/>
  </g>

  <text x="78" y="48" class="label" font-size="18">HJ.DEVLOG</text>
  <text x="78" y="242" class="muted" font-size="14">React · UI states · API · deployment</text>
  <circle id="pulse3" cx="874" cy="48" r="5" fill="#F2C879"/>
</svg>
